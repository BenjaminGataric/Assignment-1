<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converter App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <body class="bg-slate-100 min-h-screen">
      <header class="bg-white border-b border-late-200">
        <div
          class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between"
        >
          <h1 class="text-lg font-bold text-blue-900">Measurement Converter</h1>
          <span
            class="text-xs font-semibold text-green-700 bg-green-100 px-3 py-1 rounded-full"
            >CPRG 306: Assignment 1</span
          >
        </div>
      </header>
      <section>
        <h2>Convert Metrics to fit your needs</h2>
        <p>Select the unit you would like to convert</p>
      </section>
      <main>
        <div>
          <h3>Celcius to Farhenheight</h3>
          <button
            class="text-xs text-blue-800 text-decoration:none"
            onclick="location.href = '/pages/degrees.html'"
          >
            Convert Degrees
          </button>
        </div>
        <div>
          <h3>Convert Litres to Gallons</h3>
          <button
            class="text-xs text-red-800 text-decoration:none"
            onclick="location.href = '/pages/Liters.html'"
          >
            Convert Measurement
          </button>
        </div>
        <div>
          <h3>Kilograms to Pounds</h3>
          <button
            class="text-xs text-green-800 text-decoration:none"
            onclick="location.href = '/pages/volume.html'"
          >
            Convert Volume
          </button>
        </div>
      </main>
    </body>
  </body>
</html>
