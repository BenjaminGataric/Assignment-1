<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converter App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <body class="bg-slate-100 min-h-screen">
      <header class="bg-white border-b border-late-200">
        <div
          class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between"
        >
          <h1 class="text-lg font-bold text-blue-900">Measurement Converter</h1>
          <span
            class="text-xs font-semibold text-green-700 bg-green-100 px-3 py-1 rounded-full"
            >CPRG 306: Assignment 1</span
          >
        </div>
      </header>
      <section class="max-w-5xl mx-auto px-6 pt-12 pb-8 text-center">
        <h2 class="text02xl sm:text-4xl font-bold text-slate-900">
          Convert Metrics to fit your needs
        </h2>
        <p class="text-base text-slate-600 mt-3 max-w-xl mx-auto">
          Select the unit you would like to convert
        </p>
      </section>
      <main class="max-w-5xl mx-auto px-6 pb-16">
        <div
          class="grid grid-cols-1 md:grid=cols-3 gap-6 bg-blue-400 rounded-lg"
        >
          <h3 class="text-lg font-bold text-slate-800 pl-100">
            Celcius to Farhenheight
          </h3>
          <button
            id="switchToDegrees"
            class="w-3xl mt-4 rounded-lg bg-blue-600 px-4 py-2 ml-30 font-semibold text-white hover:bg-blue-700 transition cursor-pointer"
          >
            Convert Degrees
          </button>
        </div>
        <div
          class="grid grid-cols-1 md:grid=cols-3 mt-15 gap-6 bg-red-400 rounded-lg"
        >
          <h3 class="text-lg font-bold text-slate-800 pl-100">
            Convert Litres to Gallons
          </h3>
          <button
            id="switchToLitres"
            class="w-3xl mt-4 rounded-lg bg-red-600 px-4 py-2 ml-30 font-semibold text-white hover:bg-red-700 transition cursor-pointer"
          >
            Convert Measurement
          </button>
        </div>
        <div
          class="grid grid-cols-1 md:grid=cols-3 mt-15 gap-6 bg-green-400 rounded-lg"
        >
          <h3 class="text-lg font-bold text-slate-800 pl-100">
            Kilograms to Pounds
          </h3>
          <button
            id="switchToVolume"
            class="w-3xl mt-4 rounded-lg bg-green-600 px-4 py-2 ml-30 font-semibold text-white hover:bg-green-700 transition cursor-pointer"
          >
            Convert Volume
          </button>
        </div>
      </main>
      <footer class="bg-white border-t border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-6 text-center">
    <p class="text-sm text-slate-500">
    Built with Tailwind CSS and TypeScript &middot; CPRG 306 Web Development 2
    </p>
    </div>
    </footer>

      <script src="../scripts/index.js"></script>
  </body>
</html>
