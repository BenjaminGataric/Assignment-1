<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Measurement Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <header class="bg-white border-b border-late-200">
      <div
        class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <h1 class="text-lg font-bold text-blue-900">
          <a href="index.html">Measurement Converter</a>
        </h1>
        <span
          class="text-xs font-semibold text-green-700 bg-green-100 px-3 py-1 rounded-full"
          >CPRG 306: Assignment 1</span
        >
      </div>
    </header>
    <nav class="bg-gray-600">
      <ul class="mx-auto flex max-w-5xl items-center gap-6 px-6 py-4">
        <li>
          <a href="../index.html" class="text-white hover:text-gray-300"
            >Home</a
          >
        </li>
        <li>
          <a href="degrees.html" class="text-white hover:text-gray-300"
            >Tempeture</a
          >
        </li>
        <li>
          <a href="volume.html" class="text-white hover:text-gray-300"
            >Weight</a
          >
        </li>
        <li>
          <a href="distance.html" class="text-white hover:text-gray-300"
            >Distance</a
          >
        </li>
      </ul>
    </nav>
    <section class="text-center p-6">
      <h1 class="text-2xl font-bold text-slate-900">Distance Converter</h1>
      <p class="text-base text-slate-600 mt-3 max-w-xl mx-auto">
        Convert Miles to Kilometres or Kilometres to Miles
      </p>
    </section>
    <main class="max-wl-5xl mx-auto px-50 pb-16">
      <div class="bg-white rounded-2xl shadow-md p-6">
        <h3 class="text-lg font-bold text-slate-900">Distance</h3>
        <p class="text-sm text-slate-500 m-1">
          Imperial: Miles<br />Metric: Kilometres
        </p>
        <form id="distance-form">
          <div>
            <label for="direction" class="block font-medium"
              >Convert from:</label
            >
            <select
              id="direction"
              class="mt-1 w-full rounded-lg border border-slate-300 p-3 bg-grey-200"
            >
              <option value="milesToKm">Miles to Kilometres</option>
              <option value="kmToMiles">Kilometres to Miles</option>
            </select>
          </div>

          <label
            for="distance"
            class="block text-sm font-medium text-slate-700 mt-5 mb-2"
            >Value or list of values.</label
          >
          <input
            id="distance"
            type="text"
            placeholder="Example: 15 or 0, 10, 100"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-purple-500 focus-outline-none"
          />
          <p class="mt-1 text-sm text-slate-500">
            Seperate multiple values with commas.
          </p>

          <button
            id="distance-button"
            type="submit"
            class="w-full mt-4 rounded-lg bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-700 transition cursor-pointer"
          >
            Convert
          </button>
        </form>
        <p id="error" class="mt-2 text-sm text-red-600"></p>
        <div class="mt-5 rounded-lg bg-slate-200 p-4 text-center">
          <p class="text-xs uppercase tracker-wide text-slate-500">Distance</p>
          <p id="result" class="text-2xl font-bold text-green-600 mt-1">0.00</p>
        </div>
      </div>
    </main>
    <script src="../scripts/distance.js"></script>
  </body>
</html>
