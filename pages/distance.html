<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Measurement Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <header class="bg-white border-b border-late-200">
        <div
          class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <h1 class="text-lg font-bold text-blue-900"><a href="index.html">Measurement Converter</a></h1>
          <span class="text-xs font-semibold text-green-700 bg-green-100 px-3 py-1 rounded-full"
            >CPRG 306: Assignment 1</span>
        </div>
    </header>
    <section class="text-center p-6">
          <h1 class="text-2xl font-bold text-slate-900">Distance Converter</h1>
          <p class="text-base text-slate-600 mt-3 max-w-xl mx-auto">Convert Miles to Kilometres or Kilometres to Miles</p>
        </section>
    <Main class="max-wl-5xl mx-auto px-6 pb-16">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">Miles to Kilometres(km)</h3>
          <p class="text-sm text-slate-500 mt-1">Imperial to Metric</p>

          <label for="miles-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">Miles</label>
          <input
            id="miles-input"
            type="number"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-purple-500 focus-outline-none"
          />

          <button
            id="miles-button"
            class="w-full mt-4 rounded-lg bg-purple-600 px-4 py-2 font-semibold text-white hover:bg-purple-700 transition cursor-pointer"
          >Convert</button>

          <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
              <p class="text-xs uppercase tracker-wide text-slate-500">Kilometres</p>
              <p id="miles-results" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">Kilometres(km) to Miles</h3>
          <p class="text-sm text-slate-500 mt-1">Metric to Imperial</p>

          <label for="km-input" class="block text-sm font-medium text-slate-700 mt-5 mb-2">Kilometres</label>
          <input
            id="km-input"
            type="number"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-purple-500 focus-outline-none"
          />

          <button
            id="km-button"
            class="w-full mt-4 rounded-lg bg-purple-600 px-4 py-2 font-semibold text-white hover:bg-purple-700 transition cursor-pointer"
          >Convert</button>

          <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
              <p class="text-xs uppercase tracker-wide text-slate-500">Miles</p>
              <p id="miles-results" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
          </div>
        </div>
      </div>
    </Main>
  </body>
</html>
