<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Degrees Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <header class="bg-white border-b border-late-200">
      <div
        class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <a href="/pages/index.html" class="text-lg font-bold text-blue-900"
          >Measurement Converter</a
        >
        <span
          class="text-xs font-semibold text-green-700 bg-green-100 px-3 py-1 rounded-full"
          >CPRG 306: Assignment 1</span
        >
      </div>
    </header>
    <section class="max-w-5xl mx-auto px-6 pt-12 pb-8 text-center">
      <h2 class="text-2xl sm:text-4xl font-bold text-slate-900">
        Convert Degrees
      </h2>
      <p class="text-base text-slate-600 mt-3 max-w-xl mx-auto">
        Convert Celcius to Farhenheight or Farhenheight to Celcius
      </p>
    </section>
    <main class="max-w-5xl mx-auto px-6 pb-16">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">
            Celcius to Farhenheight
          </h3>
          <p class="text-sm text-slate-500 mt-1">Metric to Imperial</p>
          <input
            id="cInput"
            type="number"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-blue-500 focus:outline-none"
          />
          <button
            id="convertCToF"
            class="w-full mt-4 rounded-lg bg-violet-600 px-4 py-2 font-semibold text-white hover:bg-violet-700 transition cursor-pointer"
          >
            Convert
          </button>
        </div>
        <div class="bg-white rounded-2xl shadow-md p-6">
          <h3 class="text-lg font-bold text-slate-900">
            Celcius to Farhenheight
          </h3>
          <p class="text-sm text-slate-500 mt-1">Metric to Imperial</p>
          <input
            id="cInput"
            type="number"
            value="0"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-blue-500 focus:outline-none"
          />
          <button
            id="convertCToF"
            class="w-full mt-4 rounded-lg bg-violet-600 px-4 py-2 font-semibold text-white hover:bg-violet-700 transition cursor-pointer"
          >
            Convert
          </button>
        </div>
      </div>
      <div class="mt-6 bg-white rounded-2xl shadow-md p-6">
        <h3 class="text-lg font-bold text-slate-900">
          Celcius to Farhenheight
        </h3>
        <p class="text-sm text-slate-500 mt-1">Metric to Imperial</p>
        <input
          id="cInput"
          type="number"
          value="0"
          class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900 focus:border-blue-500 focus:outline-none"
        />
        <button
          id="convertCToF"
          class="w-full mt-4 rounded-lg bg-violet-600 px-4 py-2 font-semibold text-white hover:bg-violet-700 transition cursor-pointer"
        >
          Convert
        </button>
      </div>
    </main>
    <script src="../scripts/degrees.js"></script>
  </body>
</html>
